<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 测试客户端</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      font-family: inherit;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .response {
      margin-top: 30px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }

    .response h3 {
      margin-bottom: 12px;
      color: #333;
    }

    .response-content {
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #555;
      line-height: 1.6;
    }

    .error {
      border-left-color: #e74c3c;
      background: #fee;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .info-box {
      background: #e3f2fd;
      border-left: 4px solid #2196f3;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 4px;
    }

    .info-box strong {
      display: block;
      margin-bottom: 5px;
      color: #1976d2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Perplexity API 测试客户端</h1>
    <p class="subtitle">测试 Perplexity API 代理服务</p>

    <div class="info-box">
      <strong>📝 使用说明：</strong>
      1. 确保 API 服务器已启动 (cd api && npm start)<br>
      2. 填写服务器地址和问题<br>
      3. 点击发送测试 API 响应
    </div>

    <form id="chatForm">
      <div class="form-group">
        <label for="serverUrl">服务器地址</label>
        <input
          type="text"
          id="serverUrl"
          value="http://localhost:3000"
          placeholder="http://localhost:3000"
        >
      </div>

      <div class="form-group">
        <label for="message">你的问题</label>
        <textarea
          id="message"
          placeholder="例如：什么是量子计算？"
        >什么是量子计算？</textarea>
      </div>

      <button type="submit" id="submitBtn">
        发送请求
      </button>
    </form>

    <div id="response" style="display: none;"></div>
  </div>

  <script>
    const form = document.getElementById('chatForm');
    const responseDiv = document.getElementById('response');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const serverUrl = document.getElementById('serverUrl').value;
      const message = document.getElementById('message').value;

      if (!message.trim()) {
        alert('请输入问题');
        return;
      }

      // 显示加载状态
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading"></span>发送中...';
      responseDiv.style.display = 'none';

      try {
        const response = await fetch(`${serverUrl}/api/chat`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            messages: [
              { role: 'user', content: message }
            ]
          })
        });

        const data = await response.json();

        // 显示响应
        responseDiv.style.display = 'block';

        if (response.ok) {
          const content = data.choices?.[0]?.message?.content || '无响应内容';
          responseDiv.className = 'response';
          responseDiv.innerHTML = `
            <h3>✅ 响应成功</h3>
            <div class="response-content">${content}</div>
          `;
        } else {
          responseDiv.className = 'response error';
          responseDiv.innerHTML = `
            <h3>❌ 请求失败</h3>
            <div class="response-content">${JSON.stringify(data, null, 2)}</div>
          `;
        }

      } catch (error) {
        responseDiv.style.display = 'block';
        responseDiv.className = 'response error';
        responseDiv.innerHTML = `
          <h3>❌ 网络错误</h3>
          <div class="response-content">${error.message}</div>
        `;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '发送请求';
      }
    });
  </script>
</body>
</html>
